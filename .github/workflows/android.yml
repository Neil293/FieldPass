name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk FieldPass.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FieldPass-apk
          path: FieldPass.apk

      - name: Publish to release "android-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --title "FieldPass Android app" --notes "Latest FieldPass Android app build."
          gh release upload android-latest FieldPass.apk --clobber
          gh release edit android-latest --notes "Build ${{ github.run_number }} (version 1.0.${{ github.run_number }}) from ${GITHUB_SHA::7}, $(date -u +'%Y-%m-%d %H:%M UTC'). Download FieldPass.apk below and open it on the phone to install or update."
